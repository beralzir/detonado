<section class="phase" id="{{ID}}">
 <div class="phead">
  <div class="mid">
   <div class="tag">{{TAG}}</div>
   <h2>{{TITULO}}</h2>
   <p>{{RESUMO}}</p>
  </div>
  <label class="pdone"><input type="checkbox" data-done="{{ID}}">Fase concluída</label>
 </div>
 <div class="checks">
{{ETAPAS}}
 </div>
 <div class="nota" data-nota="{{ID}}">
  <label for="nota-{{ID}}">Anotações desta fase</label>
  <textarea id="nota-{{ID}}" rows="3" placeholder="Escreva aqui. O Claude lê e leva para o markdown do repo."></textarea>
  <span class="notast" role="status" aria-live="polite"></span>
 </div>
</section>
