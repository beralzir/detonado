<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITULO}}</title>
<style>
/* Tokens (assets/guia/tokens/ do detonado): claro em :root, escuro no prefers-color-scheme e no data-theme */
{{TOKENS_CSS}}
/* Prancheta: coluna de 1040 px com barra de estado fixa. CSS proprio sobre o contrato de tokens:
   o layout do guia vivo (navegacao lateral, heroi escuro) nao serve aqui. */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent);text-underline-offset:3px}
p{margin:0}
ul,ol{margin:0;padding:0}
code{font-family:var(--mono);font-size:.88em;color:var(--fg);background:var(--pre);padding:1px 5px;overflow-wrap:anywhere}
strong{font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pular{position:absolute;left:-999px;top:8px;z-index:50;background:var(--panel);color:var(--accent);padding:10px 14px;border:2px solid var(--accent)}
.pular:focus{left:8px}
.wrap{max-width:1040px;margin-inline:auto;padding:0 20px 96px}
@media (max-width:480px){.wrap{padding-inline:16px}}

/* barra fixa */
.topo{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--l2);padding-top:env(safe-area-inset-top,0px)}
.topo-in{max-width:1040px;margin-inline:auto;padding:8px 20px 0;display:grid;gap:6px}
@media (max-width:480px){.topo-in{padding:8px 16px 0}}
.topo-l1{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;min-width:0}
.topo-nome{font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px;min-width:0}
.topo-nome #topo-titulo{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tarja{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;font-weight:700;background:var(--fg);color:var(--panel);padding:2px 7px;flex:none}
.topo-dir{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-width:0}
.cont{font-family:var(--mono);font-size:13px;color:var(--t2);font-variant-numeric:tabular-nums}
.pilula{font-family:var(--mono);font-size:12.5px;padding:2px 9px;border:1px solid var(--t5);color:var(--t2);white-space:nowrap}
.pilula[data-s="salvo"],.pilula[data-a="aprovada"]{border-color:var(--good);color:var(--good)}
.pilula[data-s="erro"],.pilula[data-s="local"],.pilula[data-a="desatualizada"]{border-color:var(--support-text);color:var(--support-text);border-style:dashed}
.pilula[data-a="aprovada"]{border-width:2px;font-weight:700}
.nav{display:flex;gap:6px;overflow-x:auto;padding-block:4px 9px;scrollbar-width:thin}
.nav a{flex:none;font-size:13.5px;text-decoration:none;padding:5px 10px;border:1px solid var(--t5);color:var(--t2);background:var(--panel);min-height:28px;display:inline-flex;align-items:center}
.nav a:hover{border-color:var(--fg);color:var(--fg)}

/* capa */
.capa{display:grid;gap:18px;padding-block:32px 28px}
.eyebrow{font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,58px);line-height:1;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:clamp(24px,3.6vw,32px);line-height:1.1;letter-spacing:-.015em;margin:0;text-wrap:balance}
h3{font-size:17px;line-height:1.3;margin:0;font-weight:700}
.lede{font-size:18px;line-height:1.5;max-width:68ch;color:var(--t1)}
.sub{color:var(--t3);max-width:70ch}
.uso{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;counter-reset:uso;list-style:none}
.uso li{background:var(--panel);border:1px solid var(--l2);padding:12px 14px 12px 44px;position:relative;font-size:15px;min-width:0;color:var(--t1)}
.uso li::before{counter-increment:uso;content:counter(uso);position:absolute;left:13px;top:9px;font:700 24px/1 var(--display);color:var(--t4)}
.cartao-aprov{border:2px solid var(--t5);background:var(--panel);padding:14px 16px;display:grid;gap:8px}
.cartao-aprov[data-a="aprovada"]{border-color:var(--good);background:var(--good-tint)}
.cartao-aprov[data-a="desatualizada"]{border-color:var(--support-text);border-style:dashed;background:var(--support-tint)}
.cartao-aprov .tit{font-weight:700;font-size:16px}
.cartao-aprov .det{font-size:14.5px;color:var(--t2)}

/* seções */
section.bloco{display:grid;gap:18px;padding-block:40px 6px;border-top:1px solid var(--l2);scroll-margin-top:150px}
.cab{display:grid;gap:8px}
.cartoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.cartao{background:var(--panel);border:1px solid var(--l2);padding:16px;display:grid;gap:9px;align-content:start;min-width:0}
.cartao p{font-size:15px;color:var(--t1)}
.fonte{font-family:var(--mono);font-size:12.5px;color:var(--t3);line-height:1.45;overflow-wrap:anywhere}
.falta{font-size:14px;color:var(--t2)}
.nota-fina{font-size:13.5px;color:var(--t3);max-width:76ch}
.pistas{font-size:14.5px;color:var(--t2);background:var(--hov);padding:12px 14px}

/* selos em forma, não só em cor */
.selo,.sev{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:2px 8px;border:1.5px solid var(--fg);color:var(--fg);width:max-content;max-width:100%}
.selo.documentado{border-style:solid}
.selo.alegado{border-style:dashed}
.selo.nao_confirmado{border-style:dotted;border-width:2px}
.selo.misto{border-style:double;border-width:3px}
.sev.alto{border-width:3px}
.sev.medio{border-style:dashed}
.sev.baixo{border-style:dotted;border-width:2px}
.rec{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--fg);color:var(--panel);padding:2px 7px;width:max-content}

/* listas de linha */
.linhas{display:grid;border:1px solid var(--l2);background:var(--panel);list-style:none}
.linhas>li{display:grid;gap:4px 14px;padding:11px 14px;border-top:1px solid var(--l1);font-size:14.5px;align-items:baseline;min-width:0}
.linhas>li:first-child{border-top:0}
.pedidos>li{grid-template-columns:2.2rem minmax(0,1fr) auto}
.pedidos .n{font:700 20px/1 var(--display);color:var(--t4)}
.pedidos .q{font-family:var(--mono);font-size:13px;color:var(--t2);text-align:right}
.riscos>li{grid-template-columns:5.5rem minmax(0,1fr) minmax(0,1fr)}
.acessos>li{grid-template-columns:10rem minmax(0,1fr)}
.acessos .k{font-weight:700}
.mit{color:var(--t2)}
@media (max-width:700px){.pedidos>li{grid-template-columns:2rem minmax(0,1fr)}.pedidos .q{grid-column:2;text-align:left}.riscos>li,.acessos>li{grid-template-columns:minmax(0,1fr)}}

/* linha do tempo */
.legenda{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;align-items:center;color:var(--t2)}
.legenda span{display:inline-flex;align-items:center}
.legenda i{display:inline-block;width:22px;height:10px;margin-right:7px}
.lg-1{background:var(--serie-1)}
.lg-2{background:var(--serie-2)}
.lg-f{width:0!important;height:16px!important;border-left:1.5px dashed var(--t3)}
.lg-g{border:1.2px dashed var(--t4)}
.tempo-box{overflow-x:auto;border:1px solid var(--l2);background:var(--panel)}
.tempo-box:focus-visible{outline-offset:-2px}
.tempo-box svg{display:block;min-width:720px;width:100%;height:auto}
.g-dia{font-family:var(--mono);font-size:12px;fill:var(--t3)}
.g-grade{stroke:var(--l1);stroke-width:1}
.g-fase{font-family:var(--display);font-weight:700;font-size:16px;fill:var(--fg)}
.g-fnome{font-size:12.5px;fill:var(--t3)}
.g-rot,.g-fixat,.g-delta,.g-conf,.g-hojet{paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.g-rot{font-size:12.5px;fill:var(--fg)}
.g-s1{fill:var(--serie-1)}
.g-s2{fill:var(--serie-2)}
.g-fantasma{fill:none;stroke:var(--t4);stroke-width:1.2;stroke-dasharray:4 3}
.g-fixa{stroke:var(--t3);stroke-width:1.2;stroke-dasharray:3 3}
.g-fixat{font-size:12px;font-weight:600;fill:var(--t2)}
.g-hoje{stroke:var(--fg);stroke-width:1.5}
.g-hojet{font-family:var(--mono);font-size:11.5px;font-weight:700;fill:var(--fg)}
.g-delta{font-family:var(--mono);font-size:12px;font-weight:700;fill:var(--fg)}
.g-conf{font-size:12px;font-weight:700;fill:var(--bad)}
.g-linha{cursor:default}
.g-linha:focus{outline:none}
.g-linha:focus-visible .g-alvo{stroke:var(--accent);stroke-width:2}
.g-alvo{fill:transparent;stroke:transparent}
.marcos{display:grid;border:1px solid var(--l2);background:var(--panel);list-style:none}
.marco{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:12px 14px;border-top:1px solid var(--l1);align-items:center}
.marco:first-child{border-top:0}
@media (max-width:700px){.marco{grid-template-columns:minmax(0,1fr)}}
.mc-txt{display:grid;gap:2px;min-width:0;font-size:14.5px}
.mc-per{font-family:var(--mono);font-size:13px;color:var(--t2)}
.mc-causa{font-size:13.5px;color:var(--t2)}
.mc-conf{font-size:13.5px;font-weight:700;color:var(--bad)}
.mover{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.mv-val{font-family:var(--mono);font-size:13px;min-width:4.5em;text-align:center;color:var(--fg)}
.efeito{font-size:14.5px;color:var(--t1);background:var(--hov);padding:12px 14px}

/* fases e passos */
.fases{display:grid;gap:16px}
.fase{background:var(--panel);border:1px solid var(--l2);padding:18px 18px 6px;display:grid;gap:4px;scroll-margin-top:150px}
.fase-cab{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;align-items:center;padding-bottom:8px}
.fase-n{font:700 38px/.95 var(--display);color:var(--fg)}
.fase-t{font-size:19px;font-weight:700;line-height:1.25}
.fase-m{font-family:var(--mono);font-size:13px;color:var(--t2)}
.fase-pausa{grid-column:1/-1;font-size:14px;color:var(--t2);padding-top:6px}
.passo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 18px;padding-block:14px;border-top:1px dashed var(--l2);align-items:start}
@media (max-width:700px){.passo{grid-template-columns:minmax(0,1fr)}}
.passo-txt{display:grid;gap:6px;min-width:0}
.passo-tit{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.passo-id{font-family:var(--mono);font-size:12.5px;color:var(--t3)}
.passo-muda{font-size:15px;color:var(--t1);max-width:70ch}
.meta{display:grid;gap:2px;font-size:13.5px;color:var(--t2);margin:0}
.meta div{display:flex;flex-wrap:wrap;gap:0 6px}
.meta dt{font-weight:700;color:var(--fg)}
.meta dt::after{content:":"}
.meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.estado{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border:1.5px solid currentColor;width:max-content}
.e-ajustar{color:var(--support-text)}
.e-cortar,.e-vetar{color:var(--bad)}
.e-incluir{color:var(--good)}
.e-fora{color:var(--t3);border-style:dashed}
.e-data{color:var(--accent)}
.e-manter,.e-ok{color:var(--t3)}
.passo[data-v="cortar"] h3,.premissa[data-v="vetar"] .pm-txt{text-decoration:line-through;text-decoration-thickness:2px}
.opcao[data-v="fora"]{background:transparent;border-style:dashed}

/* controles */
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--t5);background:var(--panel);width:max-content;max-width:100%;border-radius:var(--radius)}
.seg input,.chip input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.seg label{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;font-size:14px;font-weight:600;cursor:pointer;color:var(--t2);border-left:1px solid var(--t5);user-select:none}
.seg label:first-of-type{border-left:0}
.seg input:checked+label{background:var(--fg);color:var(--panel)}
.seg input[value="ajustar"]:checked+label{background:var(--support-text)}
.seg input[value="cortar"]:checked+label,.seg input[value="vetar"]:checked+label{background:var(--bad)}
.seg input[value="incluir"]:checked+label{background:var(--good)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:-4px}
.seg input:disabled+label{cursor:not-allowed}
.ajuste{grid-column:1/-1;display:grid;gap:8px;padding:10px 12px;background:var(--hov)}
.ajuste-rot{font-size:13.5px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;display:inline-flex}
.chip span{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border:1px solid var(--t5);font-size:14px;cursor:pointer;background:var(--panel);color:var(--t2);user-select:none}
.chip input:checked+span{border:2px solid var(--fg);font-weight:700;color:var(--fg)}
.chip input:checked+span::before{content:"\2713";margin-right:6px}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.chip input:disabled+span{cursor:not-allowed}
textarea{width:100%;min-height:62px;font:inherit;font-size:15px;line-height:1.45;padding:8px 10px;border:1px solid var(--t5);background:var(--panel);color:var(--fg);resize:vertical}
textarea::placeholder{color:var(--t4)}
textarea[readonly]{background:var(--pre)}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{min-height:44px;padding:0 18px;border:2px solid var(--fg);background:var(--fg);color:var(--panel);font:700 15px var(--sans);cursor:pointer;border-radius:var(--radius)}
.btn.sec{background:var(--panel);color:var(--fg)}
.btn.peq{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{cursor:not-allowed;opacity:.6}

/* onde mora, opções, premissas */
.casas{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cam{font-family:var(--mono);font-size:12.5px;color:var(--t2);overflow-wrap:anywhere}
.papel{font-size:13.5px;font-weight:700}
.pecas{display:grid;list-style:none}
.pecas li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:7px 0;border-top:1px solid var(--l1);font-size:14.5px;align-items:baseline}
.tag{font-family:var(--mono);font-size:11.5px;padding:0 6px;border:1px solid var(--t5);color:var(--t2);white-space:nowrap}
.tag.novo{border:2px solid var(--fg);color:var(--fg);font-weight:700}
.fluxos{display:grid;gap:6px;font-size:14.5px;color:var(--t2);list-style:none}
.fluxos li{padding-left:22px;position:relative}
.fluxos li::before{content:"\2192";position:absolute;left:0;color:var(--fg)}
.op-cab{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.op-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--t2)}
.premissa{display:grid;grid-template-columns:3rem minmax(0,1fr) auto;gap:8px 14px;padding:12px 14px;border-top:1px solid var(--l1);align-items:start}
.premissa:first-child{border-top:0}
@media (max-width:700px){.premissa{grid-template-columns:2.6rem minmax(0,1fr)}.premissa .seg{grid-column:2}}
.premissa .ajuste{grid-column:2/-1}
.pm-id{font-family:var(--mono);font-size:12.5px;color:var(--t3);padding-top:2px}
.pm-txt{font-size:15px;color:var(--t1)}

/* fechar */
.chat{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;list-style:none}
.chat li{background:var(--panel);border:1.5px solid var(--fg);padding:12px 14px;font-size:14.5px;display:grid;gap:4px;align-content:start}
.chat .r{font-size:13.5px;color:var(--t2)}
.chat .resp{font-size:14px;font-weight:700}
.chat .resp.vazia{font-weight:400;color:var(--t3)}
.resumo{display:grid;border:1px solid var(--l2);background:var(--panel);list-style:none}
.resumo li{display:grid;grid-template-columns:6.5rem minmax(0,1fr);gap:4px 14px;padding:10px 14px;border-top:1px solid var(--l1);font-size:14.5px;align-items:baseline}
.resumo li:first-child{border-top:0}
.resumo li.vazio{display:block;color:var(--t2)}
@media (max-width:480px){.resumo li{grid-template-columns:minmax(0,1fr)}}
.fim{display:grid;gap:12px;background:var(--panel);border:2px solid var(--fg);padding:18px}
.confirma{display:grid;gap:10px;border:2px dashed var(--fg);padding:14px;background:var(--hov)}
.confirma ul{list-style:disc;padding-left:20px;display:grid;gap:4px;font-size:14.5px}
.aviso{font-size:14px;padding:10px 12px;border:1.5px dashed var(--support-text);color:var(--fg)}
.fontes{display:grid;gap:6px;font-size:13.5px;color:var(--t2);list-style:none}
.fontes li{overflow-wrap:anywhere}
footer.rodape{max-width:1040px;margin:40px auto 0;padding:32px 20px 48px;display:grid;gap:12px;border-top:1px solid var(--l2)}
@media (max-width:480px){footer.rodape{padding-inline:16px}}
.dica{position:fixed;z-index:40;max-width:300px;padding:8px 11px;background:var(--fg);color:var(--panel);font-size:13.5px;line-height:1.4;pointer-events:none}

/* alto contraste do sistema: o estado marcado vive no preenchimento, que o SO descarta */
@media (forced-colors:active){
 .seg input:checked+label{forced-color-adjust:none;background:Highlight;color:HighlightText}
 .g-s1,.g-s2{forced-color-adjust:none}
 .cartao-aprov[data-a="aprovada"]{border-width:4px}
}
</style>
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<header class="topo">
 <div class="topo-in">
  <div class="topo-l1">
   <div class="topo-nome"><span class="tarja" id="tarja" hidden></span><span id="topo-titulo"></span></div>
   <div class="topo-dir">
    <span class="cont" id="contadores"></span>
    <span class="pilula" id="salvo" data-s="conectando" role="status" aria-live="polite">Conectando ao armazenamento…</span>
    <span class="pilula" id="aprov-pilula" data-a="pendente">Aguardando aprovação</span>
   </div>
  </div>
  <nav class="nav" id="nav" aria-label="Seções da prancheta"></nav>
 </div>
</header>
<main class="wrap" id="conteudo" tabindex="-1">
<noscript><p class="aviso">Esta prancheta precisa de JavaScript para mostrar o plano e guardar as marcas. O conteúdo está no conteudo.json ao lado deste arquivo.</p></noscript>
</main>
<footer class="rodape" id="rodape"></footer>
<div class="dica" id="dica" role="tooltip" hidden></div>
<script type="application/json" id="prancheta-dados">{{DADOS}}</script>
<script>
(function () {
'use strict';

var D;
try { D = JSON.parse(document.getElementById('prancheta-dados').textContent); }
catch (e) { document.getElementById('conteudo').textContent = 'Os dados desta prancheta não abriram. Gere de novo com o prancheta.py.'; return; }
var C = D.conteudo, MODO = D.modo;
var VALORES = {passo: ['manter', 'ajustar', 'cortar'], opcao: ['incluir', 'fora'], premissa: ['ok', 'vetar']};
var ROT = {manter: 'Manter', ajustar: 'Ajustar', cortar: 'Cortar', incluir: 'Incluir', fora: 'Fora', ok: 'Ok', vetar: 'Vetar'};
var STATUS = {documentado: 'Documentado', alegado: 'Alegado', nao_confirmado: 'Não confirmado', misto: 'Misto'};
var SEV = {alto: 'Alto', medio: 'Médio', baixo: 'Baixo'};
var ESF = {baixo: 'baixo', medio: 'médio', alto: 'alto'};
var QUEM = {claude: 'Claude executa', voce: 'Sua vez'};
var LIMITE_MARCO = 30, MAX_NOTA = 2000, MAX_GERAL = 4000, DIA = 86400000;
var SEM = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];

/* ------------------------------------------------------------------ utilidades */
function $(id) { return document.getElementById(id); }
function el(tag, attrs, kids) {

    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) { return; }
      if (k === 'class') { e.className = v; }
      else if (k === 'text') { e.textContent = v; }
      else { e.setAttribute(k, v === true ? '' : v); }
    });
  }
  (kids || []).forEach(function (c) {
    if (c === null || c === undefined || c === false) { return; }
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
}
var NS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, txt) {
  var e = document.createElementNS(NS, tag);
  Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
  if (txt !== undefined) { e.textContent = txt; }
  return e;
}
/* Crase vira code e asterisco duplo vira negrito, sempre por nó de texto: o conteúdo nunca vira marcação. */
function rico(s) {
  var f = document.createDocumentFragment();
  String(s === null || s === undefined ? '' : s).split(/(`[^`]+`|\*\*[^*]+\*\*)/).forEach(function (p) {
    if (!p) { return; }
    if (p.length > 2 && p.charAt(0) === '`' && p.charAt(p.length - 1) === '`') { f.appendChild(el('code', {text: p.slice(1, -1)})); }
    else if (p.length > 4 && p.slice(0, 2) === '**' && p.slice(-2) === '**') { f.appendChild(el('strong', {text: p.slice(2, -2)})); }
    else { f.appendChild(document.createTextNode(p)); }
  });
  return f;
}
function p2(n) { return (n < 10 ? '0' : '') + n; }
function quandoTxt(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) { return ''; }
  return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear() + ' às ' + p2(d.getHours()) + 'h' + p2(d.getMinutes());
}
function resumir(t, n) { t = String(t); return t.length <= n ? t : t.slice(0, n - 1).replace(/\s+$/, '') + '…'; }
function dias(n) { var a = Math.abs(n); return a + (a === 1 ? ' dia' : ' dias'); }
function sinal(n) { return n > 0 ? '+' + dias(n) : (n < 0 ? '−' + dias(n) : '0'); }
function espera(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

/* ------------------------------------------------------------------ cronograma */
function diaUTC(iso) { var p = iso.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
// <cronograma> (a mesma conta do prancheta.py: os testes comparam as duas)
function cronograma(linhas, marcos) {
  var out = {};
  linhas.forEach(function (ln) {
    var proprio = Math.trunc(marcos[ln.id] || 0), herdado = 0, causa = null;
    ln.deps.forEach(function (dep) {
      if (out[dep] && (causa === null || out[dep].efetivo > herdado)) { herdado = out[dep].efetivo; causa = dep; }
    });
    if (causa !== null && herdado === 0) { causa = null; }
    var efetivo = proprio + herdado;
    out[ln.id] = {proprio: proprio, efetivo: efetivo, ini: ln.ini + efetivo, fim: ln.ini + efetivo + ln.dur, causa: causa};
  });
  return out;
}
// </cronograma>
var COM_AGENDA = C.fases.filter(function (f) { return f.agenda; });
var ORIGEM = null, LINHAS = [], FIXAS = [], FASES = {};
C.fases.forEach(function (f) { FASES[f.id] = f; });
if (COM_AGENDA.length) {
  ORIGEM = Math.min.apply(null, COM_AGENDA.map(function (f) { return diaUTC(f.agenda.inicio); }));
  var anterior = null;
  COM_AGENDA.forEach(function (f) {
    var ag = f.agenda;
    LINHAS.push({id: f.id, ini: (diaUTC(ag.inicio) - ORIGEM) / DIA, deps: ag.depois_de ? ag.depois_de : (anterior ? [anterior] : []),
      dur: ag.segmentos.reduce(function (a, s) { return a + s.dias; }, 0), segs: ag.segmentos});
    anterior = f.id;
  });
  ((C.linha_do_tempo || {}).datas_fixas || []).forEach(function (df) {
    FIXAS.push({id: df.id, rotulo: df.rotulo, pos: (diaUTC(df.data) - ORIGEM) / DIA});
  });
}
function diaData(pos) { return new Date(ORIGEM + Math.floor(pos + 1e-9) * DIA); }
function ddmm(d) { return p2(d.getUTCDate()) + '/' + p2(d.getUTCMonth() + 1); }
function periodoTxt(ini, fim) {
  var a = Math.floor(ini + 1e-9), b = Math.max(Math.ceil(fim - 1e-9) - 1, a);
  var da = diaData(a), db_ = diaData(b);
  if (a === b) { return ddmm(da); }
  if (da.getUTCMonth() === db_.getUTCMonth() && da.getUTCFullYear() === db_.getUTCFullYear()) { return p2(da.getUTCDate()) + ' a ' + ddmm(db_); }
  return ddmm(da) + ' a ' + ddmm(db_);
}
function fixa(id) { for (var i = 0; i < FIXAS.length; i++) { if (FIXAS[i].id === id) { return FIXAS[i]; } } return null; }
function quemTxt(segs) {
  var q = [];
  segs.forEach(function (s) { var t = s.quem === 'claude' ? 'Claude' : 'você'; if (q[q.length - 1] !== t) { q.push(t); } });
  return q.length === 1 ? (q[0] === 'você' ? 'Sua vez' : 'Claude executa') : q.join(', depois ');
}

  s.em = typeof d.em === 'string' ? d.em : null;
}
function refDe(chave) {
  if (chave === 'geral') { return db.doc('estado/geral'); }
  if (chave === 'aprovacao') { return db.doc('estado/aprovacao'); }
  return db.collection('marcas').doc(chave);
}
var CORPO_APROV = null;
function corpoDe(chave) {
  var agora = new Date().toISOString();
  if (chave === 'geral') { return {nota: GERAL.nota || '', em: agora}; }
  if (chave === 'aprovacao') { return CORPO_APROV; }
  var s = S[chave];
  s.em = agora;
  return {tipo: REG[chave].tipo, valor: s.valor, atalhos: s.atalhos.slice(), nota: s.nota, em: agora};
}
function trataErro(err) {
  var code = err && err.code;
  if (code === 'invalid_argument') { podeEscrever = false; soLeitura('O armazenamento recusou a escrita: esta visualização é só leitura.'); return; }
  if (code === 'quota_exceeded') { setSalvo('erro', 'Armazenamento cheio. Diga no chat.'); return; }
  if (code === 'revoked') { podeEscrever = false; soLeitura('Acesso encerrado nesta visualização.'); return; }
  setSalvo('erro');
}
function setComRetry(ref, corpo) {
  return ref.set(corpo).catch(function (err) {
    if (err && err.code === 'unavailable') { return espera(300 + Math.random() * 600).then(function () { return ref.set(corpo); }); }
    throw err;
  });
}
/* Uma escrita por vez por documento: a que chegar no meio espera e sai com o estado mais novo. */
function grava(chave) {
  if (!db || !podeEscrever) { return Promise.resolve(false); }
  if (emVoo[chave]) { pendente[chave] = true; return emVoo[chave]; }
  var corpo = corpoDe(chave);
  setSalvo('salvando');
  var p = setComRetry(refDe(chave), corpo).then(function () { setSalvo('salvo'); return true; }, function (err) { trataErro(err); return false; })
    .then(function (ok) {
      emVoo[chave] = null;
      if (pendente[chave]) { pendente[chave] = false; return grava(chave); }
      return ok;
    });
  emVoo[chave] = p;
  return p;
}
function agenda(chave, ms) {
  if (db && podeEscrever) {
    clearTimeout(timers[chave]);
    timers[chave] = setTimeout(function () { timers[chave] = null; grava(chave).then(atualizaAprovacao); }, ms || 0);
  } else if (S[chave]) {
    S[chave].em = new Date().toISOString();  // sem db, a hora da marca é a do navegador
  }
  salvaLocal();
  atualizaResumo();
  atualizaAprovacao();
}
/* Antes de aprovar, toda marca pendente sai: senão ela chega depois e a aprovação nasce velha. */
function drenar() {
  Object.keys(timers).forEach(function (k) { if (timers[k]) { clearTimeout(timers[k]); timers[k] = null; grava(k); } });
  var voando = Object.keys(emVoo).filter(function (k) { return emVoo[k]; }).map(function (k) { return emVoo[k]; });
  return voando.length ? Promise.all(voando).then(drenar) : Promise.resolve();
}
var MOTIVO_LEITURA = '';
function soLeitura(motivo) {
  Array.prototype.forEach.call(document.querySelectorAll('main input, main button'), function (i) { i.disabled = true; });
  // Nota em só leitura, não desabilitada: o texto continua legível com o contraste normal.
  Array.prototype.forEach.call(document.querySelectorAll('main textarea'), function (t) { t.disabled = false; t.readOnly = true; });
  setSalvo(MODO === 'aprovado' ? 'aprovado' : 'leitura', motivo);
  if (MODO !== 'aprovado') { MOTIVO_LEITURA = (motivo ? motivo + ' ' : '') + 'Quem aprova é quem tem acesso de escrita a este artefato.'; }
  atualizaAprovacao();
}
function habilita() {
  pronto = true;
  if (!podeEscrever) { return; }
  Array.prototype.forEach.call(document.querySelectorAll('main input, main button, main textarea'), function (i) { i.disabled = false; });
  atualizaTempo();
  atualizaAprovacao();
}
function modoLocal(motivo) {
  db = null;
  var temLocal = carregaLocal() && salvaLocal();
  setSalvo('local', temLocal ? 'Só neste navegador' : 'Sem armazenamento');
  var av = $('aviso-local');
  av.hidden = false;
  av.textContent = (motivo || 'Esta visualização não fala com o armazenamento do artefato.') + ' ' + (temLocal
    ? 'Suas marcas ficam só neste navegador e o Claude não consegue lê-las: diga no chat o que mudou e que aprovou.'
    : 'Nem este navegador guarda as marcas: elas somem ao recarregar. Diga no chat o que mudou.');
  habilita();
  atualizaTudo();
}

/* ------------------------------------------------------------------ eventos */
function ligaControles() {
  document.addEventListener('change', function (e) {
    var t = e.target, id = t.getAttribute && t.getAttribute('data-id');
    if (!id || !S[id] || !podeEscrever) { return; }
    var s = S[id];
    if (t.type === 'radio') {
      s.valor = t.value;
      var ok = permitidos(id, s.valor);
      s.atalhos = s.atalhos.filter(function (x) { return ok.indexOf(x) >= 0; });
      atualizaItem(id);
      agenda(id, 0);
    } else if (t.type === 'checkbox') {
      var tag = t.getAttribute('data-tag'), i = s.atalhos.indexOf(tag);
      if (t.checked && i < 0) { s.atalhos.push(tag); }
      if (!t.checked && i >= 0) { s.atalhos.splice(i, 1); }
      agenda(id, 250);
    }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'nota-geral') {
      GERAL.nota = t.value.slice(0, MAX_GERAL);
      salvaLocal();
      if (db && podeEscrever) { clearTimeout(timers.geral); timers.geral = setTimeout(function () { timers.geral = null; grava('geral'); }, 800); }
      return;
    }
    var id = t.getAttribute && t.getAttribute('data-id');
    if (t.tagName === 'TEXTAREA' && id && S[id]) { S[id].nota = t.value.slice(0, MAX_NOTA); agenda(id, 800); }
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.mv') : null;
    if (!b || b.disabled || !podeEscrever) { return; }
    var id = 'm-' + b.getAttribute('data-fase'), mv = +b.getAttribute('data-mv'), s = S[id];
    var novo = mv === 0 ? 0 : s.valor + mv;
    if (Math.abs(novo) > LIMITE_MARCO || novo === s.valor) { return; }
    s.valor = novo;
    atualizaTempo();
    agenda(id, 400);
  });
  $('btn-aprovar').addEventListener('click', function () {
    var lista = $('confirma-lista');
    while (lista.firstChild) { lista.removeChild(lista.firstChild); }
    lista.appendChild(el('li', {text: contagensTxt(contagens()) + '.'}));
    var m = mudancas();
    if (!m.length) { lista.appendChild(el('li', {text: 'Nada mudado: tudo segue como recomendado.'})); }
    m.forEach(function (x) { lista.appendChild(el('li', {text: x.rot + ' · ' + x.txt})); });
    if (contagens().conflitos) { lista.appendChild(el('li', {text: 'Atenção: há fase terminando depois de uma data fixa.'})); }
    $('confirma').hidden = false;
    $('btn-confirma').focus();
  });
  $('btn-volta').addEventListener('click', function () { $('confirma').hidden = true; $('btn-aprovar').focus(); });
  $('btn-confirma').addEventListener('click', function () {
    var bc = $('btn-confirma');
    bc.disabled = true;
    drenar().then(function () {
      var ems = ORDEM.map(function (id) { return S[id].em; }).filter(Boolean).sort();
      CORPO_APROV = {aprovado: true, em: new Date().toISOString(), por: meuId, marcas_ate: ems.length ? ems[ems.length - 1] : null, resumo: contagens()};
      if (!db) { APROV = CORPO_APROV; salvaLocal(); return true; }
      return grava('aprovacao').then(function (ok) { if (ok) { APROV = CORPO_APROV; } return ok; });
    }).then(function (ok) {
      bc.disabled = false;
      $('confirma').hidden = !!ok;
      atualizaAprovacao();
      if (ok && !db) { $('aprov-estado').textContent += ' Aprovada só neste navegador: o Claude não consegue ler. Diga no chat que aprovou e o que mudou.'; }
      $('aprov-estado').focus();
    });
  });
  $('btn-desfaz').addEventListener('click', function () {
    CORPO_APROV = {aprovado: false, em: new Date().toISOString(), por: meuId, desfeita_de: APROV ? APROV.em : null};
    var feito = db ? grava('aprovacao') : Promise.resolve(true);
    feito.then(function (ok) { if (ok) { APROV = CORPO_APROV; salvaLocal(); } atualizaAprovacao(); $('aprov-estado').focus(); });
  });
}
var DICA = null;
function ligaDicas() {
  DICA = $('dica');
  var svg = $('tempo-svg');
  if (!svg) { return; }
  function alvo(e) { return e.target.closest ? e.target.closest('[data-tip]') : null; }
  function mostra(g) {
    DICA.textContent = g.getAttribute('data-tip');
    DICA.hidden = false;
    var r = g.getBoundingClientRect(), tw = Math.min(300, window.innerWidth - 24);
    var left = Math.min(Math.max(12, r.left + 20), window.innerWidth - tw - 12), topo = r.bottom + 8;
    if (topo + 90 > window.innerHeight) { topo = Math.max(12, r.top - 90); }
    DICA.style.left = left + 'px'; DICA.style.top = topo + 'px'; DICA.style.maxWidth = tw + 'px';
  }
  function esconde() { DICA.hidden = true; }
  svg.addEventListener('mouseover', function (e) { var g = alvo(e); if (g) { mostra(g); } });
  svg.addEventListener('mouseleave', esconde);
  svg.addEventListener('focusin', function (e) { var g = alvo(e); if (g) { mostra(g); } });
  svg.addEventListener('focusout', esconde);
  svg.addEventListener('click', function (e) { var g = alvo(e); if (g) { mostra(g); } });
  svg.addEventListener('keydown', function (e) {
    var g = alvo(e);
    if (e.key === 'Escape') { esconde(); }
    if (e.key === 'Enter' && g) { var a = $('fase-' + g.getAttribute('data-fase')); if (a) { a.scrollIntoView(); } }
  });
  window.addEventListener('scroll', esconde, {passive: true});
}

/* ------------------------------------------------------------------ início */
function conecta() {
  var c = window.claude;
  if (!c || typeof c.use !== 'function') { modoLocal('Aberta fora do artefato.'); return; }
  c.use('db').then(function (d) {
    if (!d) { modoLocal(); return; }
    db = d;
    setSalvo('pronto');
    c.use('user').then(function (u) {
      if (!u) { return null; }
      return Promise.all([typeof u.id === 'function' ? u.id() : null, typeof u.can === 'function' ? u.can('data.write') : null]).then(function (r) {
        meuId = r[0] || null;
        if (r[1] === false) { podeEscrever = false; soLeitura('Só leitura para você neste artefato.'); }
        atualizaAprovacao();
      });
    }).catch(function () {});
    try {
      // Assinatura uma vez só por consulta. Nada se grava ao abrir.
      db.collection('marcas').onSnapshot(function (snap) {
        snap.docs.forEach(function (doc) { if (doc.exists) { aplica(doc.id, doc.data()); } });
        ORDEM.forEach(atualizaItem); atualizaTempo(); atualizaResumo(); atualizaAprovacao();
      }, function () { setSalvo('erro', 'Sem sincronia. Recarregue a página.'); });
      db.doc('estado/aprovacao').onSnapshot(function (s) {
        var a = s.exists ? s.data() : null;
        APROV = a && typeof a.aprovado === 'boolean' && typeof a.em === 'string' ? a : null;
        atualizaAprovacao();
      }, function () {});
      db.doc('estado/geral').onSnapshot(function (s) {
        var g = s.exists ? s.data() : null;
        if (g && typeof g.nota === 'string' && !timers.geral && !emVoo.geral) {
          GERAL = {nota: g.nota.slice(0, MAX_GERAL), em: g.em || null};
          if (document.activeElement !== $('nota-geral')) { $('nota-geral').value = GERAL.nota; }
        }
      }, function () {});
      if ((C.perguntas || []).length) {
        db.collection('chat').onSnapshot(function (snap) {
          CHAT = {};
          snap.docs.forEach(function (doc) { if (doc.exists) { CHAT[doc.id] = doc.data(); } });
          atualizaChat();
        }, function () {});
      }
    } catch (err) { setSalvo('erro'); }
    habilita();
  }, function () { modoLocal(); });
}
function modoAprovado() {
  var e = D.estado || {};
  Object.keys(e.marcas || {}).forEach(function (id) { aplica(id, e.marcas[id]); });
  APROV = e.aprovacao || null;
  CHAT = e.chat || {};
  GERAL = e.geral || {nota: '', em: null};
  podeEscrever = false;
  pronto = true;
  atualizaTudo();
  soLeitura(e.lido_em ? 'Registro aprovado, lido de volta em ' + quandoTxt(e.lido_em) + '.' : 'Registro aprovado.');
  $('confirma').hidden = true;
}
function inicia() {
  document.title = C.titulo_curto || C.titulo;
  $('topo-titulo').textContent = C.titulo;
  if (C.tarja) { $('tarja').hidden = false; $('tarja').textContent = C.tarja; }
  var main = $('conteudo');
  montaCapa(main); montaPedidos(main); montaFatos(main); montaTempo(main); montaFases(main);
  montaCasas(main); montaOpcoes(main); montaPremissas(main); montaRiscos(main); montaAcessos(main); montaFechar(main);
  montaRodape(); montaNav();
  // Até o armazenamento responder, nada se marca: marca feita antes se perderia ou seria sobrescrita.
  Array.prototype.forEach.call(document.querySelectorAll('main input, main button, main textarea'), function (i) { i.disabled = true; });
  ligaControles(); ligaDicas();
  atualizaTudo();
  if (MODO === 'aprovado') { modoAprovado(); } else { conecta(); }
}
if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', inicia); } else { inicia(); }
})();
</script>
